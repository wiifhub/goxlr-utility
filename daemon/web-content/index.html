<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>GoXLR Utility Plus</title>
    <script type="module" crossorigin src="/assets/index-CuuZaJwq.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B-LQ0umd.css" />
  </head>
  <body>
    <noscript>
      <strong>The GoXLR Utility UI requires JavaScript. Please enable it to continue.</strong>
    </noscript>
    <canvas id="wheelCanvas" style="position: absolute; top: -1000px; left: -1000px; width: 130px; height: 130px"></canvas>
    <div id="colourHover" style="position: absolute; top: -1000px; left: -1000px; width: 20px; height: 20px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 5px 10px rgba(0,0,0,0.5); background-color: #fff; pointer-events: none;"></div>
    <div id="app"></div>
    <script type="text/javascript">
      window.onload = function() {
        const canvas = document.getElementById('wheelCanvas');
        const context = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => context.drawImage(img, 0, 0);
        img.src = 'wheel.png';
      };
    </script>
  </body>
</html>
